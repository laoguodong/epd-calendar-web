<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固件升级 (BLE OTA DFU)</title>
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/main.css?v=20251109">
  <style>
    .dfu-card {
      margin: 15px auto;
      padding: 20px;
      border: 2px dashed #999;
      border-radius: 8px;
      text-align: center;
      background: #fafafa;
    }
    .dfu-card.hover {
      border-color: #007bff;
      background: #f0f7ff;
    }
    .file-input {
      display: none;
    }
    .file-label {
      cursor: pointer;
      display: block;
      font-size: 16px;
      color: #333;
      padding: 10px;
    }
    .file-label strong {
      color: #007bff;
    }
    .progress-box {
      margin: 15px auto;
      border: 1px solid #ccc;
      width: 90%;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      background: #eee;
      position: relative;
    }
    .progress-bar {
      background: #28a745;
      width: 0%;
      height: 100%;
      transition: width 0.1s;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      line-height: 24px;
      font-size: 12px;
      color: #000;
      text-align: center;
      font-weight: bold;
    }
    .nav-links {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="nav-links">
      <a href="index.html">← 返回墨水屏主页</a>
      <a href="v1.5/index.html">v1.5 兼容版</a>
    </div>

    <h3>固件升级 (Web BLE Secure DFU)</h3>
    <p style="font-size: 13px; color: #666;">
      支持 nRF52 蓝牙 OTA 升级。如果设备已在 Bootloader 模式（广播名 <code>DfuTarg</code>），或者支持无感 DFU 重启，可直接连接并烧录 OTA 升级包（.zip）。
    </p>

    <fieldset>
      <legend>固件文件</legend>
      
      <div style="text-align: center; margin: 10px 0;">
        <button id="quick-load-btn" type="button" class="secondary" style="padding: 8px 16px; font-size: 14px;">⚡ 直接载入云端精简版固件 (29.4KB)</button>
      </div>

      <div id="drop" class="dfu-card">
        <input id="file" class="file-input" type="file" accept=".zip" />
        <label id="label" class="file-label" for="file">
          <strong>点击选择固件包 (.zip)</strong><br>
          <span>或者将升级包拖放到此处</span>
        </label>
      </div>

      <div id="select-box" style="text-align: center; margin: 15px 0; display: none;">
        <button id="update-btn" type="button" class="primary" style="padding: 10px 24px; font-size: 15px;">连接设备并开始升级</button>
      </div>

      <div id="status-box" class="progress-box">
        <div id="progress-bar" class="progress-bar"></div>
        <div id="progress-text" class="progress-text">0%</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>升级日志</legend>
      <pre id="log" style="height: 220px; overflow-y: auto; background: #222; color: #eee; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px;"></pre>
      <button type="button" class="secondary" onclick="document.getElementById('log').textContent = ''">清空日志</button>
    </fieldset>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
  <script src="dfu/dfu.js?v=20261030_v3"></script>

  <script>
    const dropEl = document.getElementById("drop");
    const fileEl = document.getElementById("file");
    const selectBox = document.getElementById("select-box");
    const updateBtn = document.getElementById("update-btn");
    const labelEl = document.getElementById("label");
    const statusBox = document.getElementById("status-box");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const logEl = document.getElementById("log");

    let parsedPackage = null;

    function log(msg) {
      console.log(msg);
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) {
      labelEl.innerHTML = text;
      log(text.replace(/<[^>]+>/g, ''));
    }

    function setProgress(state) {
      if (!state) {
        statusBox.style.display = "none";
        return;
      }
      statusBox.style.display = "block";
      const percent = Math.round((state.currentBytes / state.totalBytes) * 100) || 0;
      progressBar.style.width = percent + "%";
      progressText.textContent = `${state.object || 'writing'}: ${state.currentBytes}/${state.totalBytes} (${percent}%)`;
    }

    async function loadZip(file) {
      try {
        const zip = await JSZip.loadAsync(file);
        const manifestStr = await zip.file("manifest.json")?.async("string");
        if (!manifestStr) throw new Error("固件包缺少 manifest.json");
        const manifest = JSON.parse(manifestStr);
        const app = manifest.manifest?.application;
        if (!app) throw new Error("manifest.json 中未找到 application 固件段");

        const initBytes = await zip.file(app.dat_file)?.async("uint8array");
        const fwBytes = await zip.file(app.bin_file)?.async("uint8array");
        if (!initBytes || !fwBytes) throw new Error("固件包损坏：缺少 .dat 或 .bin 文件");

        parsedPackage = {
          name: file.name,
          initBytes,
          fwBytes
        };
        setStatus(`已就绪固件包: <strong>${file.name}</strong> (${fwBytes.length} 字节)`);
        selectBox.style.display = "block";
      } catch (err) {
        selectBox.style.display = "none";
        statusBox.style.display = "none";
        parsedPackage = null;
        setStatus(`<span style="color:red">解析固件包失败: ${err.message || err}</span>`);
      }
    }

    async function startUpdate() {
      if (!parsedPackage) return;
      updateBtn.disabled = true;
      setProgress(null);

      const dfu = new NordicSecureDFU(log, setProgress);

      try {
        await dfu.selectDevice();
        const mode = await dfu.connectAndCheckMode();
        if (!mode.isBootloader) {
          setStatus("设备已收到指令并重启到 DfuTarg 模式，<strong>请再次点击升级按钮</strong>并选择出现的 <code>DfuTarg</code> 设备。");
          updateBtn.disabled = false;
          return;
        }

        setStatus("正在传输 Init 描述包...");
        await dfu.transferInit(parsedPackage.initBytes);

        setStatus("正在传输应用固件...");
        await dfu.transferFirmware(parsedPackage.fwBytes);

        setStatus("<strong style='color:green'>🎉 固件升级成功！设备正在重启生效。</strong>");
        setProgress(null);
        fileEl.value = "";
      } catch (err) {
        log(`升级失败: ${err.message || err}`);
        setStatus(`<span style="color:red">升级失败: ${err.message || err}</span>`);
        statusBox.style.display = "none";
      } finally {
        updateBtn.disabled = false;
      }
    }

    
    document.getElementById("quick-load-btn").addEventListener("click", async () => {
      try {
        setStatus("正在下载精简版固件包...");
        const resp = await fetch("EPD-nRF52-charger-lite-ota.zip");
        if (!resp.ok) throw new Error("获取固件失败: " + resp.status);
        const blob = await resp.blob();
        blob.name = "EPD-nRF52-charger-lite-ota.zip";
        await loadZip(blob);
      } catch (err) {
        setStatus("<span style='color:red'>载入失败: " + err.message + "</span>");
      }
    });

    fileEl.addEventListener("change", e => loadZip(e.target.files[0]));
    updateBtn.addEventListener("click", startUpdate);

    ["drag", "dragstart", "dragend", "dragover", "dragenter", "dragleave", "drop"].forEach(name => {
      dropEl.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ["dragover", "dragenter"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.add("hover")));
    ["dragleave", "dragend", "drop"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.remove("hover")));
    dropEl.addEventListener("drop", e => loadZip(e.dataTransfer.files[0]));
  </script>
</body>
</html>
