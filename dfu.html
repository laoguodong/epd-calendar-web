<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固件升级 (BLE OTA DFU)</title>
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/main.css?v=20251109">
  <style>
    .dfu-card {
      margin: 15px auto;
      padding: 20px;
      border: 2px dashed #999;
      border-radius: 8px;
      text-align: center;
      background: #fafafa;
    }
    .dfu-card.hover {
      border-color: #007bff;
      background: #f0f7ff;
    }
    .file-input {
      display: none;
    }
    .file-label {
      cursor: pointer;
      display: block;
      font-size: 16px;
      color: #333;
      padding: 10px;
    }
    .file-label strong {
      color: #007bff;
    }
    .progress-box {
      margin: 15px auto;
      border: 1px solid #ccc;
      width: 90%;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      background: #eee;
      position: relative;
    }
    .progress-bar {
      background: #28a745;
      width: 0%;
      height: 100%;
      transition: width 0.1s;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      line-height: 24px;
      font-size: 12px;
      color: #000;
      text-align: center;
      font-weight: bold;
    }
    .nav-links {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="nav-links">
      <a href="index.html">← 返回墨水屏主页</a>
      <a href="v1.5/index.html">v1.5 兼容版</a>
    </div>

    <h3>固件升级 (Web BLE Secure DFU)</h3>
    <p style="font-size: 13px; color: #666;">
      支持 nRF52 蓝牙 OTA 升级。如果设备已在 Bootloader 模式（广播名 <code>DfuTarg</code>），或者支持无感 DFU 重启，可直接连接并烧录 OTA 升级包（.zip）。
    </p>

    <fieldset>
      <legend>固件文件</legend>
      <div id="drop" class="dfu-card">
        <input id="file" class="file-input" type="file" accept=".zip" />
        <label id="label" class="file-label" for="file">
          <strong>点击选择固件包 (.zip)</strong><br>
          <span>或者将升级包拖放到此处</span>
        </label>
      </div>

      <div id="select-box" style="text-align: center; margin: 15px 0; display: none;">
        <button id="update-btn" type="button" class="primary" style="padding: 10px 24px; font-size: 15px;">连接设备并开始升级</button>
      </div>

      <div id="status-box" class="progress-box">
        <div id="progress-bar" class="progress-bar"></div>
        <div id="progress-text" class="progress-text">0%</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>升级日志</legend>
      <pre id="log" style="height: 180px; overflow-y: auto; background: #222; color: #eee; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px;"></pre>
      <button type="button" class="secondary" onclick="document.getElementById('log').textContent = ''">清空日志</button>
    </fieldset>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crc-32/1.0.2/crc32.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
  <script src="dfu/package.js"></script>
  <script src="dfu/secure-dfu.js"></script>

  <script>
    const dropEl = document.getElementById("drop");
    const fileEl = document.getElementById("file");
    const selectBox = document.getElementById("select-box");
    const updateBtn = document.getElementById("update-btn");
    const labelEl = document.getElementById("label");
    const statusBox = document.getElementById("status-box");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const logEl = document.getElementById("log");

    let dfuPackage = null;

    function log(msg) {
      console.log(msg);
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) {
      labelEl.innerHTML = text;
      log(text);
    }

    function setProgress(state) {
      if (!state) {
        statusBox.style.display = "none";
        return;
      }
      statusBox.style.display = "block";
      const percent = Math.round((state.currentBytes / state.totalBytes) * 100) || 0;
      progressBar.style.width = percent + "%";
      progressText.textContent = `${state.object || 'writing'}: ${state.currentBytes}/${state.totalBytes} (${percent}%)`;
    }

    function setPackage(file) {
      if (!file) return;
      dfuPackage = new SecureDfuPackage(file);
      dfuPackage.load()
        .then(() => {
          setStatus(`已就绪固件包: <strong>${file.name}</strong>`);
          selectBox.style.display = "block";
        })
        .catch(err => {
          selectBox.style.display = "none";
          statusBox.style.display = "none";
          setStatus(`<span style="color:red">解析固件包失败: ${err.message || err}</span>`);
        });
    }

    async function startUpdate() {
      if (!dfuPackage) return;
      updateBtn.disabled = true;
      setStatus("正在扫描蓝牙 DFU 设备...");
      setProgress(null);

      const dfu = new SecureDfu(CRC32.buf);
      dfu.addEventListener("log", event => log(event.message));
      dfu.addEventListener("progress", event => setProgress(event));

      try {
        const device = await dfu.requestDevice(true);
        if (!device) {
          setStatus("已切换至 Bootloader 模式，请再次点击开始升级选择设备");
          updateBtn.disabled = false;
          return;
        }

        const baseImage = await dfuPackage.getBaseImage();
        if (baseImage) {
          setStatus(`正在烧录 ${baseImage.type}: ${baseImage.imageFile}...`);
          await dfu.update(device, baseImage.initData, baseImage.imageData);
        }

        const appImage = await dfuPackage.getAppImage();
        if (appImage) {
          setStatus(`正在烧录 ${appImage.type}: ${appImage.imageFile}...`);
          await dfu.update(device, appImage.initData, appImage.imageData);
        }

        setStatus("<strong style='color:green'>升级完成！设备已重启。</strong>");
        setProgress(null);
        fileEl.value = "";
      } catch (err) {
        log(`升级异常: ${err.message || err}`);
        setStatus(`<span style="color:red">升级失败: ${err.message || err}</span>`);
        statusBox.style.display = "none";
      } finally {
        updateBtn.disabled = false;
      }
    }

    fileEl.addEventListener("change", e => setPackage(e.target.files[0]));
    updateBtn.addEventListener("click", startUpdate);

    ["drag", "dragstart", "dragend", "dragover", "dragenter", "dragleave", "drop"].forEach(name => {
      dropEl.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ["dragover", "dragenter"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.add("hover")));
    ["dragleave", "dragend", "drop"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.remove("hover")));
    dropEl.addEventListener("drop", e => setPackage(e.dataTransfer.files[0]));
  </script>
</body>
</html>
