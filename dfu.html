<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固件升级 (BLE OTA DFU)</title>
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/main.css?v=20251109">
  <style>
    .dfu-card {
      margin: 20px auto;
      padding: 30px 20px;
      border: 2px dashed #007bff;
      border-radius: 8px;
      text-align: center;
      background: #f8fbff;
      cursor: pointer;
    }
    .dfu-card:hover {
      background: #eef6ff;
    }
    .file-input {
      display: none;
    }
    .file-label {
      cursor: pointer;
      display: block;
      font-size: 16px;
      color: #333;
    }
    .file-label strong {
      color: #007bff;
      font-size: 17px;
    }
    .progress-box {
      margin: 15px auto;
      border: 1px solid #ccc;
      width: 100%;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      background: #eee;
      position: relative;
    }
    .progress-bar {
      background: #28a745;
      width: 0%;
      height: 100%;
      transition: width 0.1s;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      line-height: 24px;
      font-size: 12px;
      color: #000;
      text-align: center;
      font-weight: bold;
    }
    .nav-links {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }
    .preset-box {
      margin: 10px 0 15px 0;
      padding: 10px;
      background: #f1f3f5;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="nav-links">
      <a href="index.html">← 返回墨水屏主页</a>
      <a href="v1.5/index.html">v1.5 兼容版</a>
    </div>

    <h3>固件升级 (Web BLE Secure DFU)</h3>
    <p style="font-size: 13px; color: #666;">
      支持 nRF52 蓝牙空中 OTA 升级。请在下方选择你的 OTA 固件升级包（<code>.zip</code> 格式）。
    </p>

    <fieldset>
      <legend>选择固件</legend>

      <div class="dfu-card" id="drop">
        <input id="file" class="file-input" type="file" accept=".zip" />
        <label id="label" class="file-label" for="file">
          <strong>📁 点击选择本地固件包 (.zip)</strong><br>
          <span style="color: #666; font-size: 13px; margin-top: 6px; display: inline-block;">支持拖放文件，或从手机文件管理中选择</span>
        </label>
      </div>

      <div class="preset-box">
        <strong>备用固件下载：</strong>
        <a href="https://raw.githubusercontent.com/laoguodong/epd-calendar-web/main/EPD-nRF52-charger-lite-ota.zip" download="EPD-nRF52-charger-lite-ota.zip" style="font-weight: bold;">
          ⬇️ 下载 29.4KB 精简版固件 (EPD-nRF52-charger-lite-ota.zip)
        </a>
        <div style="margin-top: 6px; color: #666;">
          如需使用上述精简固件，点击下载后，在上方点击“选择本地固件包”选中该文件即可。
        </div>
      </div>

      <div id="select-box" style="text-align: center; margin: 15px 0; display: none;">
        <button id="update-btn" type="button" class="primary" style="padding: 12px 28px; font-size: 16px; font-weight: bold;">
          连接设备并开始升级
        </button>
      </div>

      <div id="status-box" class="progress-box">
        <div id="progress-bar" class="progress-bar"></div>
        <div id="progress-text" class="progress-text">0%</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>升级日志</legend>
      <pre id="log" style="height: 220px; overflow-y: auto; background: #222; color: #eee; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px;"></pre>
      <button type="button" class="secondary" onclick="document.getElementById('log').textContent = ''">清空日志</button>
    </fieldset>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
  <script src="dfu/dfu.js?v=20261030_v6"></script>

  <script>
    const dropEl = document.getElementById("drop");
    const fileEl = document.getElementById("file");
    const selectBox = document.getElementById("select-box");
    const updateBtn = document.getElementById("update-btn");
    const labelEl = document.getElementById("label");
    const statusBox = document.getElementById("status-box");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const logEl = document.getElementById("log");

    let parsedPackage = null;

    function log(msg) {
      console.log(msg);
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) {
      labelEl.innerHTML = text;
      log(text.replace(/<[^>]+>/g, ''));
    }

    function setProgress(state) {
      if (!state) {
        statusBox.style.display = "none";
        return;
      }
      statusBox.style.display = "block";
      const percent = Math.round((state.currentBytes / state.totalBytes) * 100) || 0;
      progressBar.style.width = percent + "%";
      progressText.textContent = `${state.object || 'writing'}: ${state.currentBytes}/${state.totalBytes} (${percent}%)`;
    }

    async function loadZip(file) {
      if (!file) return;
      try {
        setStatus(`正在读取固件包: <strong>${file.name}</strong>...`);
        const zip = await JSZip.loadAsync(file);
        const manifestStr = await zip.file("manifest.json")?.async("string");
        if (!manifestStr) throw new Error("固件包缺少 manifest.json");
        const manifest = JSON.parse(manifestStr);
        const app = manifest.manifest?.application;
        if (!app) throw new Error("manifest.json 中未找到 application 固件段");

        const initBytes = await zip.file(app.dat_file)?.async("uint8array");
        const fwBytes = await zip.file(app.bin_file)?.async("uint8array");
        if (!initBytes || !fwBytes) throw new Error("固件包损坏：缺少 .dat 或 .bin 文件");

        parsedPackage = {
          name: file.name,
          initBytes,
          fwBytes
        };
        setStatus(`✅ 已选定固件: <strong>${file.name}</strong> (${fwBytes.length} 字节)<br><span style="color:#007bff; font-size:13px;">点击下方按钮开始升级</span>`);
        selectBox.style.display = "block";
      } catch (err) {
        selectBox.style.display = "none";
        statusBox.style.display = "none";
        parsedPackage = null;
        setStatus(`<span style="color:red">解析固件包失败: ${err.message || err}</span><br><strong>点击重新选择</strong>`);
      }
    }

    async function startUpdate() {
      if (!parsedPackage) return;
      updateBtn.disabled = true;
      setProgress(null);

      const dfu = new NordicSecureDFU(log, setProgress);

      try {
        await dfu.selectDevice();
        const mode = await dfu.connectAndCheckMode();
        if (!mode.isBootloader) {
          setStatus("设备已收到指令并重启到 DfuTarg 模式，<strong>请再次点击升级按钮</strong>并选择出现的 <code>DfuTarg</code> 设备。");
          updateBtn.disabled = false;
          return;
        }

        setStatus("正在传输 Init 描述包...");
        await dfu.transferInit(parsedPackage.initBytes);

        setStatus("正在传输应用固件...");
        await dfu.transferFirmware(parsedPackage.fwBytes);

        setStatus("<strong style='color:green'>🎉 固件升级成功！设备正在重启生效。</strong>");
        setProgress(null);
        fileEl.value = "";
      } catch (err) {
        log(`升级失败: ${err.message || err}`);
        setStatus(`<span style="color:red">升级失败: ${err.message || err}</span>`);
        statusBox.style.display = "none";
      } finally {
        updateBtn.disabled = false;
      }
    }

    fileEl.addEventListener("change", e => loadZip(e.target.files[0]));
    updateBtn.addEventListener("click", startUpdate);

    ["drag", "dragstart", "dragend", "dragover", "dragenter", "dragleave", "drop"].forEach(name => {
      dropEl.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ["dragover", "dragenter"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.add("hover")));
    ["dragleave", "dragend", "drop"].forEach(name => dropEl.addEventListener(name, () => dropEl.classList.remove("hover")));
    dropEl.addEventListener("drop", e => loadZip(e.dataTransfer.files[0]));
  </script>
</body>
</html>
